<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14202b">
<title>ویزیتور تلفنی — صفه سپاهان</title>
<script src="visitor-config.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#eef1f4;color:#14202b;font:15px/1.7 Vazirmatn,Tahoma,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent}
button,input,textarea,select{font:inherit}
.top{background:#14202b;color:#fff;padding:12px 16px;position:sticky;top:0;z-index:5}
.top b{font-size:16px}.top small{color:#c9d3dc;display:block}
.bar{height:8px;background:#2c3f50;border-radius:4px;margin-top:8px}.bar i{display:block;height:8px;border-radius:4px;background:#7fd6cb}
.tabs{display:flex;background:#1d2e3c}.tabs button{flex:1;padding:10px;border:0;background:none;color:#c9d3dc;font-weight:700}.tabs button.on{background:#eef1f4;color:#14202b}
.wrap{padding:14px;max-width:560px;margin:0 auto}
.card{background:#fff;border:1px solid #d7dde3;border-radius:12px;padding:14px;margin-bottom:12px}
.mu{color:#5e6b78;font-size:13px}
.call{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px}
.ph{font-size:20px;font-weight:700;direction:ltr}
.cb{background:#0f6b63;color:#fff;border-radius:12px;padding:12px 22px;text-decoration:none;font-weight:700}
.rb{display:block;width:100%;border:1px solid #d7dde3;background:#fff;border-radius:12px;padding:13px;margin-bottom:8px;font-size:15px;color:#14202b}
.rb.on{border-color:#0f6b63;background:#dcefec;color:#0f6b63;font-weight:700}
.rb.on.no{border-color:#7a4e0e;background:#f8ecd5;color:#7a4e0e}
.ch{display:inline-block;border:1px solid #d7dde3;background:#fff;border-radius:99px;padding:9px 15px;margin:0 0 8px 8px;font-size:14px;color:#14202b}
.ch.on{background:#dcefec;border-color:#0f6b63;color:#0f6b63;font-weight:700}
.go{display:block;width:100%;border:0;background:#0f6b63;color:#fff;border-radius:12px;padding:14px;font-weight:700;font-size:16px}
.go:disabled{background:#9fb0bf}
.ln{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #eef1f4}
textarea,input[type=text],input[type=password]{width:100%;border:1px solid #d7dde3;border-radius:10px;padding:10px;background:#fff}
.tg{display:inline-block;font-size:12px;border-radius:99px;padding:0 10px;background:#dcefec;color:#0f6b63}.tg.a{background:#f8ecd5;color:#7a4e0e}.tg.r{background:#f6dcd9;color:#8a2a22}
.msg{background:#f8ecd5;color:#7a4e0e;border-radius:10px;padding:8px 12px;margin-bottom:10px;font-size:13px}
.tile{flex:1;text-align:center;padding:8px}.tile b{display:block;font-size:22px}
label.k{display:flex;align-items:center;gap:10px;padding:6px 0}
input[type=checkbox]{width:20px;height:20px}
</style>
</head>
<body><div id="app"></div>
<script>
const CFG=window.VISITOR_CONFIG||{},LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
const $=s=>document.querySelector(s),fa=n=>Number(n||0).toLocaleString('fa-IR'),esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const R={ordered:'سفارش داد',not_needed:'جواب داد، سفارش نداد',no_answer:'جواب نداد',call_later:'بعداً زنگ بزنم',wrong_number:'شماره اشتباه'},REASONS=['قیمت بالا','کالا دارد','جای دیگر می‌خرد','تعطیل است','نیاز ندارد','مشکل مالی','دیگر'];
const S={key:LS.get('vk',''),name:'',date:'',rows:[],links:[],view:'call',cur:null,d:{},err:'',busy:false,login:'',sent:null};
const iso=(n=0)=>{const d=new Date(Date.now()+n*864e5);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const done=()=>LS.get('vd:'+S.date,{}),queue=()=>LS.get('vq',[]);
async function api(b){if(!CFG.api||CFG.api.includes('PASTE'))throw new Error('آدرس صندوق در visitor-config.js تنظیم نشده است');const r=await fetch(CFG.api,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(b)});return r.json()}
async function load(){S.busy=true;draw();try{const j=await api({action:'list',k:S.key});if(!j.ok){if(j.error==='bad_key'){if(!S.rows.length){S.login='کد اشتباه است یا هنوز همگام‌سازی نشده؛ چند دقیقه بعد دوباره امتحان کنید.';LS.del('vk');S.key=''}else S.err='کد شما هنوز در برنامه فعال نیست.'}else S.err=j.error||'خطا'}
    else{S.name=j.name;S.date=j.date;S.rows=j.rows;S.links=j.links||[];S.err='';LS.set('vc',{name:j.name,date:j.date,rows:j.rows,links:S.links,at:Date.now()})}}
  catch(e){S.err=e.message&&e.message.includes('تنظیم')?e.message:'ارتباط برقرار نیست؛ نتیجه‌ها ذخیره می‌شوند و بعداً ارسال می‌شوند.';const c=LS.get('vc',null);if(c&&!S.rows.length){S.name=c.name;S.date=c.date;S.rows=c.rows;S.links=c.links||[]}}
  S.busy=false;flush();draw()}
async function flush(){let q=queue();if(!q.length||!S.key)return;try{while(q.length){const part=q.slice(0,20),j=await api({action:'submit',k:S.key,items:part});if(!j.ok)throw new Error(j.error);q=q.slice(part.length);LS.set('vq',q)}S.err=S.err.includes('ارتباط')?'':S.err}catch(e){S.err='ارتباط برقرار نیست؛ '+fa(queue().length)+' نتیجه هنوز ارسال نشده است.'}draw()}
const pend=()=>{const dn=done();return S.rows.filter(r=>!dn[r.c])};
function pick(c){S.cur=c;S.d={};S.view='call';draw()}
function save(){const r=S.rows.find(x=>x.c===S.cur)||{},d=S.d;if(!d.result)return;
  const it={cl:S.date+'-'+S.cur+'-'+Date.now().toString(36),cid:S.cur,n:r.n||'',result:d.result,reason:d.reason||'',note:(d.note||'').trim(),next:d.next||'',joined:d.joined?1:0,link:d.link?1:0,dd:r.d||'',at:new Date().toISOString().slice(0,19)};
  const dn=done();dn[S.cur]=it;LS.set('vd:'+S.date,dn);LS.set('vq',queue().concat([it]));S.cur=null;S.d={};S.rows=S.rows.slice();flush();draw();window.scrollTo(0,0)}
function stats(){const v=Object.values(done()),c=k=>v.filter(x=>x.result===k).length,rs={};v.filter(x=>x.result==='not_needed'&&x.reason).forEach(x=>rs[x.reason]=(rs[x.reason]||0)+1);
  return{total:v.length+pend().length,calls:v.length,answered:c('ordered')+c('not_needed')+c('call_later'),orders:c('ordered'),joined:v.filter(x=>x.joined).length,reasons:Object.entries(rs).sort((a,b)=>b[1]-a[1])}}
async function sendDay(){const s=stats();S.busy=true;draw();const it={t:'day_end',cl:'day-'+S.date+'-'+S.key.slice(0,4)+'-'+Date.now().toString(36),day:S.date,total:s.total,done:s.calls,summary:{answered:s.answered,orders:s.orders,joined:s.joined,reasons:s.reasons}};
  LS.set('vq',queue().concat([it]));await flush();S.busy=false;if(!queue().length){S.sent=new Date().toLocaleTimeString('fa-IR',{hour:'2-digit',minute:'2-digit'});LS.set('vs:'+S.date,S.sent)}draw()}
function copy(u){(navigator.clipboard?navigator.clipboard.writeText(u):Promise.reject()).then(()=>alert('لینک کپی شد')).catch(()=>prompt('لینک را کپی کنید:',u))}
function draw(){const a=$('#app');if($('#nt'))S.d.note=$('#nt').value;
  if(!S.key){a.innerHTML=`<div class="top"><b>ویزیتور تلفنی</b><small>صفه سپاهان</small></div><div class="wrap"><div class="card"><b>کد ورود شما</b><div class="mu" style="margin:4px 0 10px">کدی که مدیر به شما داده را وارد کنید (یا لینک اختصاصی‌تان را باز کنید).</div>${S.login?`<div class="msg">${esc(S.login)}</div>`:''}<input id="kin" type="password" dir="ltr" placeholder="کد ورود" autocomplete="off"><button class="go" style="margin-top:10px" data-a="login">ورود</button></div></div>`;return}
  const dn=done(),p=pend(),s=stats(),pct=s.total?Math.round(100*s.calls/s.total):0;S.sent=S.sent||LS.get('vs:'+S.date,null);
  let h=`<div class="top"><b>${esc(S.name||'ویزیتور')}</b><small>${S.date?new Date(S.date+'T12:00:00').toLocaleDateString('fa-IR',{weekday:'long',day:'numeric',month:'long'}):''} · ${fa(s.calls)} از ${fa(s.total)}</small><div class="bar"><i style="width:${pct}%"></i></div></div>
  <div class="tabs"><button class="${S.view==='call'?'on':''}" data-a="v:call">تماس</button><button class="${S.view==='list'?'on':''}" data-a="v:list">لیست (${fa(p.length)})</button><button class="${S.view==='end'?'on':''}" data-a="v:end">پایان روز</button></div><div class="wrap">`;
  if(S.err)h+=`<div class="msg">${esc(S.err)}</div>`;
  if(S.view==='call'){const r=S.rows.find(x=>x.c===S.cur)||S.rows.find(x=>x.c===(p[0]||{}).c);
    if(!r)h+=`<div class="card" style="text-align:center"><b>${S.rows.length||s.calls?'همه‌ی تماس‌های امروز انجام شد 🎉':'لیست امروز هنوز آماده نیست'}</b><div class="mu" style="margin-top:6px">${S.rows.length||s.calls?'برای ارسال گزارش به «پایان روز» بروید.':'چند دقیقه بعد دوباره بروزرسانی کنید.'}</div><button class="go" style="margin-top:12px" data-a="reload">بروزرسانی</button></div>`;
    else{S.cur=r.c;const d=S.d;
      h+=`<div class="card"><b style="font-size:18px">${esc(r.n)}</b>${r.o?`<div class="mu">${esc(r.o)}</div>`:''}<div class="mu">${esc(r.a||'')}${r.z?' · '+esc(r.z):''}</div><div class="call"><span class="ph">${esc(r.p||'—')}</span>${r.p?`<a class="cb" href="tel:${esc(r.p)}">تماس</a>`:''}</div><div class="mu" style="margin-top:8px">آخرین سفارش: ${r.lo?new Date(r.lo+'T12:00:00').toLocaleDateString('fa-IR'):'—'}${r.lr?' · آخرین تماس: '+esc(R[r.lr]||''):''}${r.ln?' — '+esc(r.ln):''}</div></div>
      <div class="mu" style="margin:0 2px 6px">نتیجه‌ی تماس</div>${Object.entries(R).map(([k,t])=>`<button class="rb ${d.result===k?'on'+(k==='not_needed'?' no':''):''}" data-a="res:${k}">${t}</button>`).join('')}`;
      if(d.result==='not_needed')h+=`<div class="mu" style="margin:6px 2px">چرا؟</div><div>${REASONS.map(x=>`<span class="ch ${d.reason===x?'on':''}" data-a="rs:${x}">${x}</span>`).join('')}</div>`;
      if(d.result==='call_later')h+=`<div class="mu" style="margin:6px 2px">کی دوباره زنگ بزنم؟</div><div>${[[1,'فردا'],[2,'۲ روز دیگر'],[3,'۳ روز دیگر']].map(([n,t])=>`<span class="ch ${d.next===iso(n)?'on':''}" data-a="nx:${n}">${t}</span>`).join('')}</div>`;
      h+=`<div class="card" style="margin-top:6px"><label class="k"><input type="checkbox" data-a="jn" ${d.joined?'checked':''}> ثبت‌نام کرد (عضو کانال شد)</label><label class="k"><input type="checkbox" data-a="lk" ${d.link?'checked':''}> لینک سفارش را فرستادم</label>${S.links.length?`<div style="margin-top:6px">${S.links.map((l,i)=>`<span class="ch" data-a="cp:${i}">کپی لینک: ${esc(l.t)}</span>`).join('')}</div>`:''}<textarea id="nt" rows="2" placeholder="یادداشت…" style="margin-top:6px">${esc(d.note||'')}</textarea></div>
      <button class="go" data-a="save" ${d.result&&(d.result!=='not_needed'||d.reason)?'':'disabled'}>ثبت و مشتری بعدی</button><button class="rb" style="margin-top:8px" data-a="skip">فعلاً رد شو</button>`}}
  else if(S.view==='list'){h+=`<div class="card">${S.rows.map(r=>`<div class="ln" data-a="pick:${r.c}"><div style="flex:1"><b>${esc(r.n)}</b><div class="mu">${esc(r.o||'')}${r.o&&r.z?' · ':''}${esc(r.z||'')}</div></div>${dn[r.c]?`<span class="tg ${dn[r.c].result==='ordered'?'':'a'}">${R[dn[r.c].result]}</span>`:`<span class="mu">${esc(r.p||'')}</span>`}</div>`).join('')||'<div class="mu">لیستی نیست</div>'}${Object.values(dn).filter(x=>!S.rows.find(r=>r.c===x.cid)).map(x=>`<div class="ln"><div style="flex:1"><b>${esc(x.n)}</b></div><span class="tg ${x.result==='ordered'?'':'a'}">${R[x.result]}</span></div>`).join('')}</div>`}
  else{h+=`<div class="card"><div style="display:flex">${[['تماس',s.calls],['جواب داد',s.answered],['سفارش',s.orders],['ثبت‌نام',s.joined]].map(([l,v])=>`<div class="tile"><b>${fa(v)}</b><span class="mu">${l}</span></div>`).join('')}</div></div>${s.reasons.length?`<div class="card"><b>چرا سفارش ندادند؟</b>${s.reasons.map(([k,n])=>`<div style="margin-top:8px"><div class="mu" style="display:flex;justify-content:space-between"><span>${esc(k)}</span><span>${fa(n)}</span></div><div class="bar" style="background:#d7dde3"><i style="width:${Math.round(100*n/Math.max(1,s.answered-s.orders))}%;background:#0f6b63"></i></div></div>`).join('')}</div>`:''}
    <div class="card" style="background:${p.length?'#f8ecd5':'#fff'}"><b>${p.length?fa(p.length)+' مشتری هنوز تماس نگرفته‌اید':'همه‌ی تماس‌ها انجام شد'}</b><div class="mu">${p.length?'به فردا می‌روند، یا همین حالا ادامه دهید.':''}</div></div>
    <button class="go" data-a="end" ${S.busy?'disabled':''}>ارسال گزارش امروز به برنامه</button>${S.sent?`<div class="mu" style="text-align:center;margin-top:8px">✓ آخرین ارسال: ساعت ${S.sent}</div>`:''}${queue().length?`<div class="mu" style="text-align:center;margin-top:6px">${fa(queue().length)} مورد در انتظار ارسال</div>`:''}<button class="rb" style="margin-top:14px" data-a="logout">خروج از این گوشی</button>`}
  a.innerHTML=h+'</div>'}
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t)return;const [k,v]=t.dataset.a.split(/:(.*)/s);
  if(k==='login'){const x=$('#kin').value.trim();if(!x)return;S.key=x;LS.set('vk',x);S.login='';load()}
  else if(k==='v'){S.view=v;draw()}else if(k==='reload')load();else if(k==='res'){S.d.result=v;S.d.reason='';S.d.next=v==='call_later'?iso(1):'';draw()}
  else if(k==='rs'){S.d.reason=v;draw()}else if(k==='nx'){S.d.next=iso(+v);draw()}else if(k==='cp')copy(S.links[+v].u);
  else if(k==='save'){S.d.note=($('#nt')||{}).value||'';save()}else if(k==='skip'){const p=pend(),i=p.findIndex(x=>x.c===S.cur);S.rows=S.rows.filter(x=>x.c!==S.cur).concat(S.rows.filter(x=>x.c===S.cur));S.cur=null;S.d={};draw()}
  else if(k==='pick'){pick(+v)}else if(k==='end')sendDay();else if(k==='logout'){if(confirm('از این گوشی خارج می‌شوید؟ نتیجه‌های ارسال‌نشده از بین می‌رود.')){['vk','vq','vc'].forEach(LS.del);location.hash='';location.reload()}}});
document.addEventListener('change',e=>{const k=e.target.dataset.a;if(k==='jn'){S.d.joined=e.target.checked}else if(k==='lk'){S.d.link=e.target.checked}});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S.key)load()});window.addEventListener('online',flush);setInterval(()=>{if(S.key&&!document.hidden)load()},120000);
(function(){const m=location.hash.match(/k=([^&]+)/);if(m){S.key=decodeURIComponent(m[1]);LS.set('vk',S.key);history.replaceState(null,'',location.pathname+location.search)}
  const c=LS.get('vc',null);if(c){S.name=c.name;S.date=c.date;S.rows=c.rows;S.links=c.links||[]}if(S.key)load();else draw()})();
</script></body></html>
