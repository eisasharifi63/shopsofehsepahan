<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ثبت سفارش</title>
<script src="config.js" onerror="void 0"></script>
<script src="https://developer.eitaa.com/eitaa-web-app.js" async onerror="void 0"></script>
<style>
:root{--p:#16a34a;--pd:#15803d;--bg:#f4f6f8;--card:#fff;--tx:#0f172a;--sub:#64748b;--bd:#e2e8f0;--red:#dc2626;--r:12px}
*{box-sizing:border-box;margin:0;padding:0;font-family:Vazirmatn,Tahoma,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--tx);padding-bottom:calc(84px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid var(--bd);padding:12px 14px 8px}
header h1{font-size:1.05rem;text-align:center;margin-bottom:8px}
#q{width:100%;padding:10px 12px;border:1px solid var(--bd);border-radius:10px;font-size:.95rem;background:#f8fafc}
#cats{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:none}
#cats button{flex:none;border:1px solid var(--bd);background:#fff;border-radius:99px;padding:5px 12px;font-size:.8rem;color:var(--sub)}
#cats button.on{background:var(--p);border-color:var(--p);color:#fff}
main{max-width:640px;margin:0 auto;padding:12px}
#list{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:10px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:6px}
.card.out{opacity:.55}
.card img{width:100%;height:105px;object-fit:cover;border-radius:8px;background:#eee}
.nm{font-weight:600;font-size:.9rem;line-height:1.5}.cd{font-size:.72rem;color:var(--sub)}
select{width:100%;padding:7px;border:1px solid var(--bd);border-radius:8px;font-size:.82rem;background:#f8fafc}
.pr{font-weight:700;color:var(--p);font-size:.92rem}
.st{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:auto}
.st button{width:38px;height:38px;border:none;border-radius:10px;font-size:1.3rem;font-weight:700;background:var(--p);color:#fff}
.st button.m{background:#e2e8f0;color:var(--tx)}.st button:disabled{opacity:.35}
.st b{min-width:30px;text-align:center}
.na{font-size:.8rem;color:var(--red);text-align:center;padding:9px 0}
#bar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#fff;border-top:1px solid var(--bd);padding:10px 14px calc(10px + env(safe-area-inset-bottom));display:flex;align-items:center;justify-content:space-between;max-width:640px;margin:0 auto}
#bar small{color:var(--sub);font-size:.75rem;display:block}#bar b{color:var(--p);font-size:1.05rem}
.btn{background:var(--p);color:#fff;border:none;border-radius:10px;padding:12px 20px;font-weight:700;font-size:.95rem}
.btn:disabled{opacity:.5}.btn.g{background:#e2e8f0;color:var(--tx)}
#ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:30;align-items:flex-end;justify-content:center}
#ov.on{display:flex}
#sh{background:#fff;width:100%;max-width:640px;max-height:92vh;overflow-y:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
#sh h3{margin-bottom:10px;font-size:1rem}
.ln{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--bd)}
.ln .i{flex:1;min-width:0}.ln .i div:first-child{font-size:.88rem;font-weight:600}.ln .i div:last-child{font-size:.75rem;color:var(--sub)}
.ln .st button{width:32px;height:32px;font-size:1.1rem}
.tot{display:flex;justify-content:space-between;font-weight:700;padding:12px 0}
.f{margin-bottom:10px}.f label{display:block;font-size:.8rem;font-weight:600;margin-bottom:4px}
.f input,.f textarea{width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;font-size:.95rem}
#err{color:var(--red);font-size:.85rem;margin:8px 0;min-height:1.2em}
.ok{text-align:center;padding:18px 0}.ok h3{color:var(--p);margin-bottom:8px}
.em{text-align:center;color:var(--sub);padding:30px 0;grid-column:1/-1}
</style>
</head>
<body>
<header><h1 id="shop">ثبت سفارش</h1><input id="q" type="search" placeholder="جستجوی نام یا کد کالا…" autocomplete="off"><div id="cats"></div></header>
<main><div id="list"><div class="em">در حال بارگذاری…</div></div></main>
<div id="bar"><div><small>جمع سبد (<span id="cn">۰</span> قلم)</small><b id="tt">۰</b></div><button class="btn" id="go">مشاهده سبد و ثبت</button></div>
<div id="ov"><div id="sh"></div></div>
<script>
const $=s=>document.querySelector(s),fa=n=>Number(n||0).toLocaleString('fa-IR');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const UL={pc:'عدد',pack:'بسته',ctn:'کارتن'};
const CFG=window.MINIAPP_CONFIG||{},API=CFG.api||'',IMG=CFG.img||(API?'img/':'/img/');   // با config.js می‌شود به «صندوق پست» وصل کرد؛ بدون آن به برنامه‌ی همین کامپیوتر
const ref=x=>/^\d+$/.test(String(x))?fa(x):esc(x);
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const nrm=s=>String(s||'').replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/ي/g,'ی').replace(/ك/g,'ک').replace(/\u200c/g,' ').toLowerCase();
let P=[],CUR='تومان',CAT='',Q='',CART=LS.get('cart',{}),SEL={},busy=false;
const byCode=c=>P.find(p=>p.code===c);
const unitOf=(p,u)=>p.units.find(x=>x.u===u);
const uLabel=x=>x.u==='pc'?'عدد':`${UL[x.u]} ${fa(x.size)} عددی`;
const getTg=()=>window.Eitaa&&window.Eitaa.WebApp;
function initTg(){const t=getTg();try{t&&(t.ready(),t.expand())}catch(e){}}
initTg();addEventListener('load',initTg);

async function load(){
  try{
    const r=await fetch(API?API+'?action=products':'/api/miniapp/products');if(!r.ok)throw 0;
    const d=await r.json();P=d.products;CUR=d.currency||CUR;$('#shop').textContent=d.shop||'ثبت سفارش';document.title=d.shop||'ثبت سفارش';
    for(const k of Object.keys(CART)){const [c,u]=k.split('|'),p=byCode(c),x=p&&unitOf(p,u);   // سبد ذخیره‌شده را با قیمت و موجودی فعلی هماهنگ کن
      if(!x||x.max<1)delete CART[k];else CART[k]=Math.min(CART[k],x.max)}
    LS.set('cart',CART);cats();paint();bar();
  }catch(e){$('#list').innerHTML='<div class="em">اتصال برقرار نشد.<br><br><button class="btn" onclick="load()">تلاش دوباره</button></div>'}
}
function cats(){
  const cs=[...new Set(P.map(p=>p.category).filter(Boolean))];
  $('#cats').innerHTML=cs.length?['',...cs].map(c=>`<button class="${c===CAT?'on':''}" data-cat="${esc(c)}">${c?esc(c):'همه'}</button>`).join(''):'';
}
function card(p){
  const sel=SEL[p.code]||(SEL[p.code]=(p.units.find(x=>x.max>0)||p.units[0]).u),x=unitOf(p,sel),q=CART[p.code+'|'+sel]||0;
  const out=p.units.every(u=>u.max<1);
  const opts=p.units.map(u=>`<option value="${u.u}" ${u.u===sel?'selected':''} ${u.max<1?'disabled':''}>${uLabel(u)}${u.max<1?' (ناموجود)':''}</option>`).join('');
  return `<div class="card ${out?'out':''}" data-c="${esc(p.code)}">${p.image?`<img loading="lazy" src="${esc(IMG)}${encodeURIComponent(p.image)}" alt="" onerror="this.remove()">`:''}
  <div><div class="nm">${esc(p.name)}</div><div class="cd">کد: ${esc(p.code)}</div></div>
  ${p.units.length>1?`<select>${opts}</select>`:`<div class="cd">${uLabel(x)}</div>`}
  <div class="pr">${fa(x.price)} ${esc(CUR)}</div>
  ${out?'<div class="na">ناموجود</div>':`<div class="st"><button data-a="inc" ${q>=x.max?'disabled':''}>+</button><b>${q?fa(q):'—'}</b><button class="m" data-a="dec" ${q?'':'disabled'}>−</button></div>`}</div>`;
}
function paint(){
  const w=nrm(Q).split(/\s+/).filter(Boolean);
  const l=P.filter(p=>(!CAT||p.category===CAT)&&w.every(t=>nrm(p.name+' '+p.code).includes(t)));
  $('#list').innerHTML=l.map(card).join('')||'<div class="em">کالایی پیدا نشد</div>';
}
function repaint(code){const el=$(`#list [data-c="${CSS.escape(code)}"]`),p=byCode(code);if(el&&p)el.outerHTML=card(p)}
function setQ(k,n){
  const [c,u]=k.split('|'),x=unitOf(byCode(c),u);n=Math.max(0,Math.min(n,x.max));
  n?CART[k]=n:delete CART[k];LS.set('cart',CART);bar();
}
function lines(){return Object.keys(CART).map(k=>{const [c,u]=k.split('|'),p=byCode(c),x=p&&unitOf(p,u);return p&&x?{k,p,x,q:CART[k]}:null}).filter(Boolean)}
function total(){return lines().reduce((s,l)=>s+l.q*l.x.price,0)}
function bar(){$('#cn').textContent=fa(lines().length);$('#tt').textContent=fa(total())+' '+CUR}

$('#q').addEventListener('input',e=>{Q=e.target.value;paint()});
$('#cats').addEventListener('click',e=>{const b=e.target.closest('[data-cat]');if(!b)return;CAT=b.dataset.cat;cats();paint()});
$('#list').addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b)return;const c=b.closest('.card').dataset.c,k=c+'|'+SEL[c];
  setQ(k,(CART[k]||0)+(b.dataset.a==='inc'?1:-1));repaint(c)});
$('#list').addEventListener('change',e=>{if(e.target.tagName!=='SELECT')return;const c=e.target.closest('.card').dataset.c;SEL[c]=e.target.value;repaint(c)});

function sheet(){
  const ls=lines();
  if(!ls.length){$('#sh').innerHTML='<h3>سبد خرید</h3><div class="em">سبد خالی است</div><button class="btn g" style="width:100%" data-close>بستن</button>';return}
  const me=LS.get('me',{}),tg=getTg(),u=tg&&tg.initDataUnsafe&&tg.initDataUnsafe.user;
  const nm=me.name||(u?[u.first_name,u.last_name].filter(Boolean).join(' '):'');
  $('#sh').innerHTML=`<h3>سبد خرید</h3>${ls.map(l=>`<div class="ln" data-k="${esc(l.k)}"><div class="i"><div>${esc(l.p.name)}</div><div>${uLabel(l.x)} · ${fa(l.x.price)} ${esc(CUR)} · جمع ${fa(l.q*l.x.price)}</div></div>
   <div class="st"><button data-a="inc" ${l.q>=l.x.max?'disabled':''}>+</button><b>${fa(l.q)}</b><button class="m" data-a="dec">−</button></div></div>`).join('')}
  <div class="tot"><span>جمع کل</span><span>${fa(total())} ${esc(CUR)}</span></div>
  <h3 style="margin-top:6px">مشخصات تحویل‌گیرنده</h3>
  <div class="f"><label>نام و نام خانوادگی</label><input id="nm" value="${esc(nm)}" autocomplete="name"></div>
  <div class="f"><label>شماره موبایل</label><input id="ph" type="tel" inputmode="tel" placeholder="۰۹۱۲۳۴۵۶۷۸۹" value="${esc(me.phone||'')}" autocomplete="tel"></div>
  <div class="f"><label>آدرس</label><textarea id="ad" rows="2" placeholder="شهر، خیابان، پلاک…">${esc(me.address||'')}</textarea></div>
  <div class="f"><label>توضیحات (اختیاری)</label><input id="nt" maxlength="300"></div>
  <div id="err"></div><button class="btn" style="width:100%" id="sub">ثبت نهایی سفارش</button>
  <button class="btn g" style="width:100%;margin-top:8px" data-close>ادامه‌ی خرید</button>`;
}
$('#go').onclick=()=>{sheet();$('#ov').classList.add('on')};
$('#ov').addEventListener('click',e=>{if(e.target.id==='ov'||e.target.closest('[data-close]'))$('#ov').classList.remove('on')});
$('#sh').addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');
  if(b){const k=b.closest('.ln').dataset.k;setQ(k,(CART[k]||0)+(b.dataset.a==='inc'?1:-1));const c=k.split('|')[0];repaint(c);
    const keep={nm:$('#nm')?.value,ph:$('#ph')?.value,ad:$('#ad')?.value,nt:$('#nt')?.value};sheet();
    for(const [i,v] of Object.entries(keep))if($('#'+i)&&v!=null)$('#'+i).value=v;return}
  if(e.target.id==='sub')submit()});

async function submit(){
  if(busy)return;const err=$('#err');err.textContent='';
  const name=$('#nm').value.trim();let ph=nrm($('#ph').value).replace(/\D/g,'');
  if(ph.startsWith('98')&&ph.length===12)ph='0'+ph.slice(2);if(ph.length===10&&ph[0]==='9')ph='0'+ph;
  if(name.length<3)return err.textContent='نام و نام خانوادگی را کامل بنویسید';
  if(!/^09\d{9}$/.test(ph))return err.textContent='شماره موبایل معتبر نیست (مثلاً ۰۹۱۲۳۴۵۶۷۸۹)';
  const ad=$('#ad').value.trim();if(ad.length<8)return err.textContent='آدرس را کامل‌تر بنویسید';
  let key=LS.get('okey',null);if(!key){key=(self.crypto&&crypto.randomUUID)?crypto.randomUUID():String(Date.now())+Math.random().toString(36).slice(2);LS.set('okey',key)}
  const items=lines().map(l=>({code:l.p.code,unit:l.x.u,qty:l.q}));
  busy=true;const btn=$('#sub');btn.disabled=true;btn.textContent='در حال ثبت…';
  try{
    const body=JSON.stringify({action:'order',key,customer:{name,phone:ph,address:ad},note:$('#nt').value.trim(),items});
    const r=await fetch(API||'/api/miniapp/order',{method:'POST',headers:{'Content-Type':API?'text/plain;charset=utf-8':'application/json'},body});   // text/plain یعنی درخواست «ساده» و Google پیش‌درخواست (preflight) نمی‌خواهد
    const d=await r.json().catch(()=>({ok:false,error:'پاسخ نامعتبر از سرور'}));
    if(d.ok){LS.set('me',{name,phone:ph,address:ad});LS.set('okey',null);CART={};LS.set('cart',CART);bar();
      $('#sh').innerHTML=`<div class="ok"><h3>✅ سفارش ثبت شد</h3><p>${API?'کد پیگیری':'شماره سفارش'}: <b>${ref(d.order_id)}</b></p><p style="margin:6px 0 14px">مبلغ: ${fa(d.total)} ${esc(CUR)}</p><button class="btn" data-close>بستن</button></div>`;
      busy=false;load();return}
    err.textContent=d.error||'ثبت سفارش انجام نشد';if(/تازه کنید|کافی نیست/.test(d.error||''))load();
  }catch(e){err.textContent='اتصال به سرور برقرار نشد؛ اینترنت را بررسی و دوباره امتحان کنید'}
  busy=false;if($('#sub')){$('#sub').disabled=false;$('#sub').textContent='ثبت نهایی سفارش'}
}
load();
</script>
</body>
</html>
