<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>سیستم مدیریت پخش و فروش</title>
<style>
@font-face{font-family:"VazirLocal";src:url("/static/Vazirmatn.woff2") format("woff2");font-display:swap}
:root{--ink:#14202b;--ink2:#1d2e3c;--paper:#eef1f4;--card:#fff;--line:#d7dde3;--muted:#5e6b78;--teal:#0f6b63;--teal-s:#dcefec;--amber:#b7791f;--amber-s:#f8ecd5;--red:#b3372e;--red-s:#f6dedb;--blue:#2b5f8a;--blue-s:#dde9f3;--r:8px}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:"VazirLocal",Vazirmatn,Tahoma,"Segoe UI",sans-serif;background:var(--paper);color:var(--ink);font-size:14px;line-height:1.7;display:flex}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
aside{width:224px;background:var(--ink);color:#c9d3dc;display:flex;flex-direction:column;padding:18px 12px;flex:none;overflow:auto}
.brand{padding:4px 10px 18px;border-bottom:1px solid #2c3f50;margin-bottom:12px}
.brand b{display:block;color:#fff;font-size:17px;line-height:1.4}
.brand span{font-size:12px;color:#8a9aa8}
nav button{display:flex;gap:10px;align-items:center;width:100%;background:none;border:0;border-radius:var(--r);padding:9px 12px;text-align:right;cursor:pointer;color:inherit;margin-bottom:2px}
nav button:hover{background:#1f3140}
nav button.on{background:var(--teal);color:#fff}
nav button i{font-style:normal;width:22px;text-align:center}
.sp{flex:1}
main{flex:1;overflow:auto;padding:26px 30px 60px;min-width:0}
h1{font-size:22px;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 20px}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.bar .grow{flex:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:18px}
.card h2{font-size:15px;margin:0 0 12px}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,1fr)} .g2{grid-template-columns:1.6fr 1fr} .g3{grid-template-columns:repeat(3,1fr)}
@media(max-width:1100px){.g4{grid-template-columns:repeat(2,1fr)}.g2,.g3{grid-template-columns:1fr}}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.stat small{color:var(--muted);display:block}
.stat b{font-size:22px;font-variant-numeric:tabular-nums}
.stat.hero{background:var(--ink);color:#fff;border-color:var(--ink)} .stat.hero small{color:#9fb0bf}
.stat.warn b{color:var(--red)}
input,select,textarea{border:1px solid var(--line);border-radius:6px;padding:7px 10px;background:#fff;min-width:0}
input[type=checkbox]{width:auto}
textarea{width:100%;resize:vertical}
label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:3px}
.f{margin-bottom:10px} .f input,.f select{width:100%}
.frow{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:0 12px}
.btn{border:1px solid var(--line);background:#fff;border-radius:6px;padding:7px 14px;cursor:pointer}
.btn:hover{border-color:var(--ink)}
.btn.p{background:var(--teal);border-color:var(--teal);color:#fff} .btn.p:hover{background:#0b5a53}
.btn.d{color:var(--red);border-color:#e3b9b5} .btn.s{padding:3px 9px;font-size:12.5px}
table{width:100%;border-collapse:collapse}
th{font-weight:600;color:var(--muted);font-size:12.5px;text-align:right;padding:8px 10px;border-bottom:2px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid #e8ecf0;vertical-align:middle}
tbody tr:hover{background:#f7f9fa}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.tw{overflow-x:auto}
.tag{display:inline-block;padding:1px 9px;border-radius:20px;font-size:12px;background:#e8ecf0}
.tag.g{background:var(--teal-s);color:var(--teal)} .tag.a{background:var(--amber-s);color:var(--amber)} .tag.r{background:var(--red-s);color:var(--red)} .tag.b{background:var(--blue-s);color:var(--blue)}
.thumb{width:40px;height:40px;border-radius:6px;object-fit:cover;background:#e8ecf0;display:block}
.empty{padding:34px;text-align:center;color:var(--muted)}
.chart{width:100%;height:auto;display:block}
#modal{position:fixed;inset:0;background:rgba(20,32,43,.5);display:none;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto;z-index:20}
#modal.on{display:flex}
.mbox{background:#fff;border-radius:10px;width:min(720px,100%);box-shadow:0 20px 60px rgba(0,0,0,.3)}
.mbox.wide{width:min(980px,100%)}
.mh{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;border-bottom:1px solid var(--line)}
.mh b{font-size:16px} .mh button{border:0;background:none;font-size:22px;cursor:pointer;color:var(--muted)}
.mb{padding:20px} .mf{padding:12px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-start}
#toast{position:fixed;bottom:22px;left:22px;background:var(--ink);color:#fff;padding:10px 18px;border-radius:8px;opacity:0;transition:opacity .2s;z-index:50;max-width:420px;pointer-events:none}
#toast.on{opacity:1} #toast.err{background:var(--red)}
.hint{background:var(--blue-s);color:#1f4a6e;border-radius:var(--r);padding:12px 14px;font-size:13px;margin-bottom:14px}
pre,code{direction:ltr;text-align:left;background:#f2f4f6;border-radius:6px;font-family:Consolas,monospace;font-size:12.5px}
pre{padding:12px;overflow:auto;white-space:pre-wrap}
.chk{max-height:240px;overflow:auto;border:1px solid var(--line);border-radius:6px;padding:6px}
.chk label{display:flex;gap:8px;align-items:center;color:var(--ink);font-size:13.5px;padding:3px 6px;margin:0;cursor:pointer}
.chk label:hover{background:#f2f4f6}
.pv{max-width:100px;max-height:100px;border-radius:6px;margin-top:6px}
.chip{border:1px solid var(--line);background:#fff;border-radius:20px;padding:5px 14px;cursor:pointer}
.chip:hover{border-color:var(--ink)} .chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
#login{position:fixed;inset:0;background:var(--ink);display:none;align-items:center;justify-content:center;z-index:100;padding:20px}
#login.on{display:flex}
.lbox{background:#fff;border-radius:12px;padding:30px 28px;width:min(380px,100%)}
.lbox h1{font-size:20px;margin-bottom:4px} .lbox .f{margin-top:12px}
.me{border-top:1px solid #2c3f50;padding:12px 6px 0;font-size:12.5px;color:#9fb0bf}
.me b{color:#fff;display:block;margin-bottom:6px}
.me button{background:none;border:1px solid #2c3f50;color:#c9d3dc;border-radius:6px;padding:3px 10px;cursor:pointer;margin-left:4px}
.me button:hover{border-color:#fff;color:#fff}
th.ck,td.ck{width:34px;padding-left:2px;padding-right:10px}
.grp{font-weight:600}
nav .grp.has{color:#fff}
nav .arw{font-size:11px;transition:transform .15s;font-style:normal}
nav .arw.o{transform:rotate(180deg)}
nav .sub{margin:0 22px 6px 0;padding-right:10px;border-right:1px solid #2c3f50}
nav .sub button{padding:6px 10px;font-size:13px}
nav button .fill{flex:1;text-align:right}
.bdg{background:var(--amber);color:#fff;font-style:normal;font-size:11px;border-radius:10px;padding:0 7px;line-height:18px}
#jdp-pop{position:fixed;z-index:90;display:none;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 36px rgba(20,32,43,.25);width:290px;padding:10px}
.jh{display:flex;gap:6px;align-items:center;margin-bottom:8px}
.jh select{flex:1;padding:4px 6px}
.jh button{border:1px solid var(--line);background:#fff;border-radius:6px;width:30px;height:30px;cursor:pointer;font-size:18px;line-height:1}
.jw,.jg{display:grid;grid-template-columns:repeat(7,1fr);text-align:center}
.jw b{font-size:12px;color:var(--muted);padding:3px 0;font-weight:600} .jw b.red{color:var(--red)}
.jd{border:0;background:none;border-radius:6px;height:34px;cursor:pointer}
.jd:hover{background:#eef1f4} .jd.red{color:var(--red)} .jd.today{outline:1px solid var(--teal)} .jd.sel{background:var(--teal);color:#fff}
.jf{display:flex;justify-content:space-between;margin-top:8px} .jf button{border:0;background:none;color:var(--teal);cursor:pointer}
.jnote{font-size:11px;color:var(--muted);margin-top:6px}
.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle}
.it{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #e8ecf0}
.it:last-child{border-bottom:0}
.dt{width:9px;height:9px;border-radius:50%;flex:none}
.it a{margin-inline-start:auto;color:var(--teal);cursor:pointer;font-size:13px}
.prog{height:8px;background:#e8ecf0;border-radius:6px;margin-top:12px}
.prog i{display:block;height:8px;background:var(--teal);border-radius:6px;transition:width .3s}
.f .bar select{width:auto}
.chk label.p-all{background:#e3f3ee}
.chk label.p-some{background:#fbf1dc}
.pbs{margin-inline-start:auto;font-size:11.5px;color:var(--muted)}
@media(max-width:800px){aside{width:64px}.brand span,nav button span{display:none}main{padding:16px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<aside>
  <div class="brand"><b id="brandName">فروشگاه من</b><span>مدیریت پخش و فروش</span></div>
  <nav id="nav"></nav>
  <div class="sp"></div>
  <div class="me" id="me"></div>
</aside>
<main id="view"></main>
<div id="login"></div>
<div id="modal"><div class="mbox" id="mbox"></div></div>
<div id="toast"></div>

<script>
/* ───────── ابزارها ───────── */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fa=n=>Number(n||0).toLocaleString('fa-IR');
const num=s=>{const t=String(s??'').replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[,٬\s]/g,'');return t===''||isNaN(t)?0:Number(t)};
const faDigits=s=>String(s).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);
function g2j(gy,gm,gd){const gdm=[0,31,59,90,120,151,181,212,243,273,304,334];const gy2=gm>2?gy+1:gy;let days=355666+365*gy+Math.floor((gy2+3)/4)-Math.floor((gy2+99)/100)+Math.floor((gy2+399)/400)+gd+gdm[gm-1];let jy=-1595+33*Math.floor(days/12053);days%=12053;jy+=4*Math.floor(days/1461);days%=1461;if(days>365){jy+=Math.floor((days-1)/365);days=(days-1)%365}let jm,jd;if(days<186){jm=1+Math.floor(days/31);jd=1+days%31}else{jm=7+Math.floor((days-186)/30);jd=1+(days-186)%30}return[jy,jm,jd]}
function jd(s,t){if(!s)return'';const m=String(s).match(/(\d+)-(\d+)-(\d+)(?:[ T](\d+):(\d+))?/);if(!m)return s;const[y,mo,d]=g2j(+m[1],+m[2],+m[3]);let o=`${y}/${String(mo).padStart(2,'0')}/${String(d).padStart(2,'0')}`;if(t&&m[4])o+=` ${m[4]}:${m[5]}`;return faDigits(o)}
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');

async function api(name,args={}){
  const r=await fetch('/api/'+name,{method:'POST',headers:{'X-App':'1','Content-Type':'application/json'},body:JSON.stringify(args)});
  if(r.status===401){ if(name!=='me') showLogin(false); throw new Error('AUTH') }
  const j=await r.json(); if(!j.ok) throw new Error(j.error); return j.data;
}
async function act(name,args,okMsg){ // فراخوانی با نمایش خطا/موفقیت
  try{const d=await api(name,args); if(okMsg) toast(okMsg); return d}catch(e){if(e.message!=='AUTH')toast(e.message||'خطا',true); throw e}
}
let tt;function toast(m,err){const t=$('#toast');t.textContent=m;t.className='on'+(err?' err':'');clearTimeout(tt);tt=setTimeout(()=>t.className='',3200)}
function modal(title,body,foot,wide){$('#mbox').className='mbox'+(wide?' wide':'');$('#mbox').innerHTML=`<div class="mh"><b>${title}</b><button onclick="closeModal()" aria-label="بستن">×</button></div><div class="mb">${body}</div>${foot?`<div class="mf">${foot}</div>`:''}`;$('#modal').classList.add('on')}
function closeModal(){$('#modal').classList.remove('on');$('#mbox').innerHTML=''}
$('#modal').addEventListener('mousedown',e=>{if(e.target.id==='modal')closeModal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
const view=h=>$('#view').innerHTML=h;
const fld=(l,id,v='',t='text',x='')=>`<div class="f"><label for="${id}">${l}</label><input id="${id}" type="${t}" value="${esc(v)}" ${x}></div>`;
const g=id=>$('#'+id).value;
const debounce=(f,ms=250)=>{let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>f(...a),ms)}};
const statusTag=s=>`<span class="tag ${{'جدید':'b','در حال آماده‌سازی':'a','ارسال شد':'a','تحویل شد':'g','لغو شده':'r'}[s]||''}">${esc(s)}</span>`;
const payTag=s=>`<span class="tag ${s==='پرداخت شده'?'g':s==='پرداخت در محل'?'a':'r'}">${esc(s)}</span>`;
const S={cfg:{},cur:'dashboard'};
const cur=()=>esc(S.cfg.currency||'تومان');

/* ───────── تقویم شمسی ───────── */
const JM=['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
const JW=['ش','ی','د','س','چ','پ','ج'];
const HOL={'1-1':'نوروز','1-2':'نوروز','1-3':'نوروز','1-4':'نوروز','1-12':'روز جمهوری اسلامی','1-13':'سیزده‌به‌در','3-14':'رحلت امام خمینی','3-15':'قیام ۱۵ خرداد','11-22':'پیروزی انقلاب اسلامی','12-29':'ملی شدن صنعت نفت'};
function j2g(jy,jm,jd){jy+=1595;let days=-355668+(365*jy)+Math.floor(jy/33)*8+Math.floor(((jy%33)+3)/4)+jd+((jm<7)?(jm-1)*31:((jm-7)*30)+186);let gy=400*Math.floor(days/146097);days%=146097;if(days>36524){gy+=100*Math.floor(--days/36524);days%=36524;if(days>=365)days++}gy+=4*Math.floor(days/1461);days%=1461;if(days>365){gy+=Math.floor((days-1)/365);days=(days-1)%365}let gd=days+1;const sal=[0,31,((gy%4===0&&gy%100!==0)||(gy%400===0))?29:28,31,30,31,30,31,31,30,31,30,31];let gm;for(gm=0;gm<13&&gd>sal[gm];gm++)gd-=sal[gm];return[gy,gm,gd]}
function jLeap(y){const[a,b,c]=j2g(y,12,30),r=g2j(a,b,c);return r[0]===y&&r[1]===12&&r[2]===30}
const jLen=(y,m)=>m<=6?31:m<=11?30:(jLeap(y)?30:29);
const isoOf=(y,m,d)=>y+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0');
const jIso=(y,m,d)=>{const[a,b,c]=j2g(y,m,d);return isoOf(a,b,c)};
function jMonthStart(){const n=new Date(),j=g2j(n.getFullYear(),n.getMonth()+1,n.getDate())[2];return ymd(new Date(n.getFullYear(),n.getMonth(),n.getDate()-(j-1)))}
let JP={inp:null,y:0,m:0};
const jdpEl=()=>{let p=document.getElementById('jdp-pop');if(!p){p=document.createElement('div');p.id='jdp-pop';document.body.appendChild(p)}return p};
function jdpOpen(inp){
  let y,m;if(inp.dataset.v){[y,m]=g2j(...inp.dataset.v.split('-').map(Number))}else{const n=new Date();[y,m]=g2j(n.getFullYear(),n.getMonth()+1,n.getDate())}
  JP={inp,y,m};jdpDraw();const p=jdpEl(),r=inp.getBoundingClientRect();p.style.display='block';
  p.style.top=(r.bottom+340>window.innerHeight?Math.max(8,r.top-336):r.bottom+4)+'px';p.style.left=Math.max(8,Math.min(r.left,window.innerWidth-300))+'px'}
function jdpClose(){const p=document.getElementById('jdp-pop');if(p)p.style.display='none'}
function jdpNav(k){JP.m+=k;if(JP.m>12){JP.m=1;JP.y++}if(JP.m<1){JP.m=12;JP.y--}jdpDraw()}
function jdpDraw(){
  const p=jdpEl(),{y,m,inp}=JP,sel=inp.dataset.v,today=ymd(new Date());
  const[gy,gm,gd]=j2g(y,m,1),off=(new Date(gy,gm-1,gd).getDay()+1)%7,len=jLen(y,m);
  let cells='';for(let i=0;i<off;i++)cells+='<span></span>';
  for(let d=1;d<=len;d++){const I=jIso(y,m,d),col=(off+d-1)%7,hol=HOL[m+'-'+d];
    cells+=`<button type="button" class="jd ${col===6||hol?'red':''} ${I===today?'today':''} ${I===sel?'sel':''}" ${hol?`title="${hol}"`:''} onclick="jdpPick('${I}')">${faDigits(d)}</button>`}
  const yrs=[];for(let k=y-6;k<=y+6;k++)yrs.push(k);
  p.innerHTML=`<div class="jh"><button type="button" onclick="jdpNav(-1)" aria-label="ماه قبل">›</button><select onchange="JP.m=+this.value;jdpDraw()">${JM.map((n,i)=>`<option value="${i+1}" ${i+1===m?'selected':''}>${n}</option>`).join('')}</select><select onchange="JP.y=+this.value;jdpDraw()">${yrs.map(k=>`<option value="${k}" ${k===y?'selected':''}>${faDigits(k)}</option>`).join('')}</select><button type="button" onclick="jdpNav(1)" aria-label="ماه بعد">‹</button></div>
  <div class="jw">${JW.map((w,i)=>`<b class="${i===6?'red':''}">${w}</b>`).join('')}</div><div class="jg">${cells}</div>
  <div class="jf"><button type="button" onclick="jdpPick('${today}')">امروز</button><button type="button" onclick="jdpPick('')">پاک کردن</button></div>
  <div class="jnote">جمعه‌ها و تعطیلات ثابت قرمزند (تعطیلات قمری نشان داده نمی‌شوند)</div>`}
function jdpPick(I){const inp=JP.inp;inp.dataset.v=I;inp.value=I?jd(I):'';jdpClose();inp.dispatchEvent(new Event('change'))}
function jdpTyped(inp){
  const t=inp.value.trim();if(!t){inp.dataset.v='';return}
  const m=t.replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).match(/^(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})$/);
  if(m){const y=+m[1],mo=+m[2],d=+m[3];
    if(y>=1700&&mo>=1&&mo<=12&&d>=1&&d<=31){inp.dataset.v=isoOf(y,mo,d);inp.value=jd(inp.dataset.v);return}
    if(y<1700&&mo>=1&&mo<=12&&d>=1&&d<=jLen(y,mo)){inp.dataset.v=jIso(y,mo,d);inp.value=jd(inp.dataset.v);return}}
  inp.value=inp.dataset.v?jd(inp.dataset.v):'';toast('تاریخ را مثل ۱۴۰۵/۰۷/۲۰ بنویسید',true)}
const jinput=(id,v,on='',x='')=>`<input class="jdp" id="${id}" data-v="${esc(v||'')}" value="${v?jd(v):''}" placeholder="۱۴۰۵/۰۱/۰۱" autocomplete="off" inputmode="numeric" style="width:128px" onfocus="jdpOpen(this)" onclick="jdpOpen(this)" onchange="jdpTyped(this);${on}" ${x}>`;
const jv=id=>$('#'+id).dataset.v||'';
const jtime=(id,hh='09',mm='00')=>{const o=(n,sel)=>Array.from({length:n},(_,i)=>String(i).padStart(2,'0')).map(v=>`<option value="${v}" ${v===sel?'selected':''}>${faDigits(v)}</option>`).join('');return `<select id="${id}_h">${o(24,hh)}</select> : <select id="${id}_m">${o(60,mm)}</select>`};
document.addEventListener('mousedown',e=>{const p=document.getElementById('jdp-pop');if(p&&p.style.display==='block'&&!p.contains(e.target)&&e.target!==JP.inp)jdpClose()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')jdpClose()});

/* ───────── واحدها: عدد / بسته / کارتن ───────── */
const UN={pc:'عدد',pack:'بسته',ctn:'کارتن'};
function sizesOf(p){let P=+p.pack_size||0,C=+p.ctn_size||0;if(P&&C&&C%P)C=0;return[P,C]}
const unitsOf=p=>{const[P,C]=sizesOf(p);return['pc'].concat(P?['pack']:[],C?['ctn']:[])};
const usize=(p,u)=>{const[P,C]=sizesOf(p);return u==='pc'?1:u==='pack'?P:C};

const unitName=(p,u)=>u==='pc'?'عدد':`${UN[u]} (${fa(usize(p,u))} عددی)`;

let IMP={name:'',b64:'',rows:[],counts:{},found:[]};
const stem=n=>String(n||'').replace(/\.[^.\/\\]+$/,'').trim().toLowerCase();
const readB64=f=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result.split(',')[1]);r.onerror=rej;r.readAsDataURL(f)});
function importForm(){

   <div class="f"><label>موجودی</label><select id="imp_stock"><option value="set">برابر عدد فایل شود</option><option value="add">عدد فایل به موجودی اضافه شود</option><option value="ignore">موجودی را دست نزن</option></select></div></div>
  <div class="f"><label>عکس‌ها (اختیاری، چند فایل)</label><input type="file" id="imp_i" accept="image/*" multiple onchange="impMatch()"></div>

  `<button class="btn p" id="imp_go" onclick="impApply()" disabled>ورود به برنامه</button><button class="btn" onclick="closeModal()">بستن</button>`,true)

async function impPreview(){
  const f=$('#imp_f').files[0];if(!f)return toast('اول فایل Excel را انتخاب کنید',true);
  $('#imp_out').innerHTML='<div class="sub">در حال خواندن فایل…</div>';
  try{IMP.b64=await readB64(f);IMP.name=f.name;const d=await api('import_preview',{filename:f.name,data:IMP.b64});IMP.rows=d.rows;IMP.found=d.found;IMP.counts=d.counts;impDraw()}
  catch(e){$('#imp_out').innerHTML='';$('#imp_go').disabled=true;if(e.message!=='AUTH')toast(e.message,true)}
}
function impDraw(){
  const c=IMP.counts,r=IMP.rows;
  $('#imp_out').innerHTML=`<div class="grid g4" style="margin-bottom:12px"><div class="stat"><small>کالای جدید</small><b>${fa(c.new)}</b></div><div class="stat"><small>به‌روزرسانی</small><b>${fa(c.update)}</b></div><div class="stat ${c.error?'warn':''}"><small>سطر خطادار (وارد نمی‌شود)</small><b>${fa(c.error)}</b></div><div class="stat"><small>عکس داخل فایل</small><b>${fa(c.images)}</b></div></div>
  <p class="sub" style="margin:0 0 6px">ستون‌های شناخته‌شده: ${IMP.found.map(esc).join('، ')}</p><div id="imp_match" class="sub" style="margin-bottom:8px"></div>
  <div class="tw" style="max-height:340px;overflow:auto"><table><thead><tr><th>سطر</th><th>کد</th><th>نام</th><th>دسته</th><th>واحدها</th><th>فروش (عدد)</th><th>موجودی</th><th>عکس</th><th>وضعیت</th></tr></thead><tbody>${r.slice(0,100).map(x=>`<tr><td>${fa(x.row)}</td><td>${esc(x.code)}</td><td>${esc(x.name)}</td><td>${esc(x.category)}</td><td><small>${[x.pack_size?'بسته '+fa(x.pack_size):'',x.ctn_packs?'کارتن '+fa(x.ctn_packs)+' بسته':x.ctn_pieces?'کارتن '+fa(x.ctn_pieces):''].filter(Boolean).join(' · ')}</small></td><td class="num">${x.sale==null?'':fa(x.sale)}</td><td class="num"><small>${[x.stock_ctn!=null?fa(x.stock_ctn)+' کارتن':'',x.stock_pack!=null?fa(x.stock_pack)+' بسته':'',x.stock!=null?fa(x.stock)+' عدد':''].filter(Boolean).join(' + ')}</small></td><td>${x.has_image?'داخل فایل':esc(x.image)}</td><td>${x.action==='error'?'<span class="tag r">خطا</span>':x.action==='new'?'<span class="tag g">جدید</span>':'<span class="tag b">به‌روزرسانی</span>'} ${x.msg?`<small style="color:${x.action==='error'?'var(--red)':'var(--amber)'}">${esc(x.msg)}</small>`:''}</td></tr>`).join('')}</tbody></table></div>${r.length>100?`<p class="sub">فقط ۱۰۰ سطر اول نمایش داده شده؛ در کل ${fa(r.length)} سطر بررسی شد.</p>`:''}`;
  $('#imp_go').disabled=(c.new+c.update)===0;impMatch()
}
function impMatch(){
  const el=$('#imp_match');if(!el||!IMP.rows.length)return;
  const files=[...($('#imp_i').files||[])];if(!files.length){el.textContent='';return}
  const keys=new Set(files.map(f=>stem(f.name))),used=new Set();let n=0;
  IMP.rows.forEach(x=>{if(x.action==='error'||x.has_image)return;const k=x.image?stem(x.image):stem(x.code);if(keys.has(k)){n++;used.add(k)}});
  el.innerHTML=`عکس‌ها: <b>${fa(n)}</b> کالا عکس می‌گیرند — <b>${fa(files.length-used.size)}</b> فایل عکس به هیچ کالایی نخورد`
}
async function impApply(){
  const go=$('#imp_go');go.disabled=true;
  try{
    const r=await api('import_apply',{filename:IMP.name,data:IMP.b64,on_duplicate:g('imp_dup'),stock_mode:g('imp_stock')});
    const files=[...($('#imp_i').files||[])],map=new Map(files.map(f=>[stem(f.name),f])),byRow=new Map(IMP.rows.map(x=>[x.row,x]));
    const todo=r.items.filter(it=>!it.embedded).map(it=>{const x=byRow.get(it.row)||{};const f=map.get(x.image?stem(x.image):stem(it.code));return f?{code:it.code,f}:null}).filter(Boolean);
    let ok=0,bad=0;
    for(let i=0;i<todo.length;i++){
      $('#imp_out').innerHTML=`<div class="hint">در حال بارگذاری عکس‌ها… ${fa(i+1)} از ${fa(todo.length)}</div>`;
      try{await api('product_image_set',{code:todo[i].code,image_data:await shrink(todo[i].f)});ok++}catch(e){bad++}
    }
    $('#imp_out').innerHTML=`<div class="card" style="border-color:var(--teal)"><h2>✅ ورود انجام شد</h2><p style="margin:0">${fa(r.created)} کالای جدید، ${fa(r.updated)} به‌روزرسانی${r.skipped?`، ${fa(r.skipped)} نادیده`:''}${r.error_count?`، ${fa(r.error_count)} سطر خطادار وارد نشد`:''}.<br>عکس: ${fa(r.images+ok)} ثبت شد${bad?`، ${fa(bad)} ناموفق`:''}.</p>${r.errors.length?`<table style="margin-top:10px"><tbody>${r.errors.map(e=>`<tr><td>سطر ${fa(e.row)}</td><td>${esc(e.msg)}</td></tr>`).join('')}</tbody></table>`:''}</div>`;
    refreshProducts()
  }catch(e){go.disabled=false;if(e.message!=='AUTH')toast(e.message,true)}
}

/* ───────── سفارش‌ها ───────── */
const OF={range:'today',start:'',end:'',status:'',payment:'',printed:'',search:'',page:1,per:25};
const SEL=new Set();let ORD=[],PRINT_IDS=[];
const RANGES=[['today','امروز'],['yesterday','دیروز'],['week','۷ روز اخیر'],['month','این ماه'],['all','همه'],['custom','بازه‌ی دلخواه']];
function rangeDates(){
  const n=new Date(),add=k=>new Date(n.getFullYear(),n.getMonth(),n.getDate()+k);
  switch(OF.range){
   case 'today':return{start:ymd(n),end:ymd(n)};
   case 'yesterday':return{start:ymd(add(-1)),end:ymd(add(-1))};
   case 'week':return{start:ymd(add(-6)),end:ymd(n)};
   case 'month':{const j=g2j(n.getFullYear(),n.getMonth()+1,n.getDate())[2];return{start:ymd(add(-(j-1))),end:ymd(n)}}
   case 'custom':return{start:OF.start,end:OF.end};
   default:return{start:'',end:''}}
}
const orderFilters=()=>{const r=rangeDates();return{start:r.start,end:r.end,status:OF.status,payment:OF.payment,printed:OF.printed,search:OF.search}};
const printFilters=()=>SEL.size?{ids:[...SEL].join(',')}:orderFilters();
PG.orders=async()=>{
  S.cfg=await api('settings_get');
  view(head('سفارش‌ها','هر روز فقط سفارش‌های همان روز را ببینید و چاپ کنید','<button class="btn p" onclick="newOrder()">+ سفارش جدید</button>')+`
  <div class="card" style="padding:14px"><div class="bar" id="o_chips" style="margin-bottom:10px"></div>
   <div class="bar" style="margin:0">
    <select id="o_st" onchange="setF('status',this.value)"><option value="">همه‌ی وضعیت‌ها</option>${S.cfg._statuses.map(s=>`<option>${s}</option>`).join('')}</select>
    <select id="o_pay" onchange="setF('payment',this.value)"><option value="">همه‌ی پرداخت‌ها</option>${S.cfg._payments.map(s=>`<option>${s}</option>`).join('')}</select>
    <select id="o_pr" onchange="setF('printed',this.value)"><option value="">چاپ‌شده و نشده</option><option value="0">فقط چاپ‌نشده</option><option value="1">فقط چاپ‌شده</option></select>
    <input id="o_q" placeholder="نام مشتری، تلفن یا شماره سفارش…" style="width:260px" oninput="OF.search=this.value;OF.page=1;loadOrdersD()"></div></div>
  <div class="bar" id="o_sum"></div>
  <div class="card tw" style="padding:0"><table><thead><tr><th class="ck"><input type="checkbox" onchange="selPage(this.checked)" title="انتخاب همه‌ی این صفحه"></th><th>#</th><th>زمان</th><th>مشتری</th><th>منبع</th><th>مبلغ</th><th>وضعیت</th><th>پرداخت</th><th></th></tr></thead><tbody id="ot"></tbody></table></div>
  <div class="bar" id="o_pg" style="justify-content:space-between"></div>`);
  $('#o_st').value=OF.status;$('#o_pay').value=OF.payment;$('#o_pr').value=OF.printed;$('#o_q').value=OF.search;
  drawChips();loadOrders()

function drawChips(){
  $('#o_chips').innerHTML=RANGES.map(r=>`<button class="chip ${OF.range===r[0]?'on':''}" onclick="setRange('${r[0]}')">${r[1]}</button>`).join('')+
   (OF.range==='custom'?` <label style="margin:0 8px 0 0">از</label>${jinput('o_from',OF.start,"OF.start=jv('o_from');OF.page=1;loadOrders()")}<label style="margin:0">تا</label>${jinput('o_to',OF.end,"OF.end=jv('o_to');OF.page=1;loadOrders()")}`:'');
}
function setRange(r){OF.range=r;OF.page=1;if(r==='custom'&&!OF.start){OF.start=OF.end=ymd(new Date())}drawChips();loadOrders()}
function setF(k,v){OF[k]=v;OF.page=1;loadOrders()}
const selToggle=(id,on)=>{on?SEL.add(id):SEL.delete(id);loadOrdersSum()};
function selPage(on){ORD.forEach(o=>on?SEL.add(o.id):SEL.delete(o.id));loadOrders()}
let LAST={total:0,sum:0,pages:1};
function loadOrdersSum(){const d=LAST;
  $('#o_sum').innerHTML=`<div class="grow"><b>${fa(d.total)}</b> سفارش — جمع مبلغ (بدون لغوشده): <b>${fa(d.sum)}</b> ${cur()}${SEL.size?` &nbsp;<span class="tag b">${fa(SEL.size)} انتخاب‌شده</span> <button class="btn s" onclick="SEL.clear();loadOrders()">لغو انتخاب</button>`:''}</div>
  <button class="btn" onclick="printDlg('list')">چاپ لیست</button><button class="btn" onclick="printDlg('invoices')">چاپ فاکتورها</button><button class="btn" onclick="printDlg('summary')">برگه‌ی انبار</button>`}
async function loadOrders(){
  const d=await api('orders_list',{...orderFilters(),page:OF.page,per:OF.per});
  if(d.page>d.pages){OF.page=d.pages;return loadOrders()}
  ORD=d.rows;LAST=d;loadOrdersSum();
  $('#ot').innerHTML=d.rows.map(o=>`<tr><td class="ck"><input type="checkbox" ${SEL.has(o.id)?'checked':''} onchange="selToggle(${o.id},this.checked)"></td><td>${fa(o.id)}</td><td class="num">${jd(o.created,1)}</td><td>${esc(o.customer||'—')}</td><td>${esc(o.source)}</td><td class="num"><b>${fa(o.final_total)}</b></td><td>${statusTag(o.status)}</td><td>${payTag(o.payment)}</td>
  <td style="white-space:nowrap">${o.printed?'<span class="tag g">چاپ‌شده</span> ':''}<button class="btn s" onclick="orderView(${o.id})">مشاهده</button> <button class="btn s" onclick="invoice(${o.id})">فاکتور</button></td></tr>`).join('')||emptyRow(9,'سفارشی با این فیلتر پیدا نشد');
  $('#o_pg').innerHTML=`<div><button class="btn s" ${d.page<=1?'disabled':''} onclick="OF.page--;loadOrders()">‹ قبلی</button> <span style="margin:0 10px">صفحه ${fa(d.page)} از ${fa(d.pages)}</span> <button class="btn s" ${d.page>=d.pages?'disabled':''} onclick="OF.page++;loadOrders()">بعدی ›</button></div>
   <div>نمایش <select onchange="OF.per=+this.value;OF.page=1;loadOrders()">${[25,50,100].map(n=>`<option ${n===OF.per?'selected':''}>${n}</option>`).join('')}</select> در هر صفحه</div>`
}

async function printDlg(kind){

  `<button class="btn p" onclick="document.getElementById('prf').contentWindow.print()">چاپ</button>${kind!=='summary'?`<button class="btn" onclick="markPrinted()">✔ علامت‌گذاری به‌عنوان چاپ‌شده</button>`:''}<span class="sub" style="margin:6px 6px 0">بعد از چاپ موفق، علامت‌گذاری کنید تا دفعه‌ی بعد با فیلتر «فقط چاپ‌نشده» فقط سفارش‌های تازه را بگیرید.</span>`,true)
}

async function pubExpand(id,onlyErr,force){
  const tr=$('#pe_'+id);if(!force&&tr.style.display==='table-row'){tr.style.display='none';return}
  tr.style.display='table-row';
  const rows=await api('publish_run_detail',{run_id:id,only_errors:onlyErr,search:PUBF.search});
  $('#pd_'+id).innerHTML=`<div class="bar" style="margin:4px 0"><span class="sub" style="margin:0">${onlyErr?'فقط ارسال‌های ناموفق':'همه‌ی ارسال‌ها'}</span><a style="color:var(--teal);cursor:pointer;font-size:13px" onclick="event.stopPropagation();pubExpand(${id},${!onlyErr},true)">${onlyErr?'نمایش همه':'فقط خطاها'}</a></div>`+(rows.map(x=>`<div class="it" style="padding:8px 0"><span style="width:240px">${esc(x.product)} ← ${esc(x.channel)}</span><span class="tag ${x.status==='موفق'?'g':'r'}">${x.status}</span><small style="color:var(--muted)">${esc(x.message||'')}</small>${x.status==='خطا'?`<button class="btn s" style="margin-inline-start:auto" onclick="event.stopPropagation();pubRetry(${x.id},${id},${onlyErr})">ارسال دوباره</button>`:''}</div>`).join('')||'<div class="empty" style="padding:14px">موردی نیست</div>')
}
async function pubRetry(logId,runId,onlyErr){const r=await act('publish_retry',{log_id:logId});toast(r.message,!r.ok);await pubRuns();pubExpand(runId,onlyErr,true)}
async function pubPurge(days){if(!confirm(days?`گزارش‌های قدیمی‌تر از ${fa(days)} روز پاک شود؟`:'همه‌ی گزارش‌های ارسال پاک شود؟ (صف انتشار دست نمی‌خورد)'))return;const n=await act('publish_purge',{days});toast(`${fa(n)} اجرا پاک شد`);pubRuns()}
async function pubNow(id){await act('publish_run_now',{id},'ارسال شروع شد');setTimeout(pubRefresh,600)}
async function pubStop(id){await act('publish_stop',{id},'در حال توقف…');setTimeout(pubRefresh,800)}
async function pubResume(id){await act('publish_resume',{id},'ادامه داده شد');setTimeout(pubRefresh,600)}
async function pubDel(id){if(!confirm('این کار از صف حذف شود؟'))return;await act('publish_delete',{id});pubRefresh()}
async function pubClear(){const n=await act('publish_clear_done');toast(`${fa(n)} کار پاک شد`);pubRefresh()}

  <p><b>بله:</b> در BotFather خودِ بله (@botfather) ربات بسازید، توکن را بگذارید و ربات را در کانال بله ادمین کنید. شناسه‌ی کانال: <code>@نام_کانال</code></p>

};
PG.backup=async()=>{
  const [s,L]=await Promise.all([api('settings_get'),api('backups_list')]);S.cfg=s;
  const kind={auto:'خودکار',manual:'دستی',before:'قبل از بازیابی'},sz=b=>faDigits(b>1048576?(b/1048576).toFixed(1)+' مگابایت':Math.max(1,Math.round(b/1024))+' کیلوبایت');
  view(head('پشتیبان و انتقال','هر چند ساعت یک‌بار خودکار از اطلاعات نسخه گرفته می‌شود')+
  (L.pending?`<div class="hint" style="background:var(--amber-s);color:#6b4607">یک بازیابی ثبت شده؛ برنامه را کامل ببندید و دوباره باز کنید تا اعمال شود. <button class="btn s" onclick="backupCancel()">لغو بازیابی</button></div>`:'')+`
  <div class="card"><h2>پشتیبان‌گیری خودکار</h2>
   <div class="frow"><div class="f"><label>وضعیت</label><select id="bk_en"><option value="1" ${s.backup_enabled!=='0'?'selected':''}>روشن</option><option value="0" ${s.backup_enabled==='0'?'selected':''}>خاموش</option></select></div>
    ${fld('حداکثر فاصله‌ی دو پشتیبان (ساعت)','bk_int',s.backup_interval_h,'text','inputmode="numeric"')}${fld('تعداد نسخه‌های خودکار که نگه داشته شود','bk_keep',s.backup_keep,'text','inputmode="numeric"')}</div>
   ${fld('پوشه‌ی دوم (اختیاری): فلش، هارد دیگر یا پوشه‌ی همگام‌شده؛ مثلاً D:\\Backup','bk_dir',s.backup_dir2,'text','dir="ltr"')}
   <p class="sub" style="margin:0 0 12px">آخرین پشتیبان: <b>${L.last?jd(L.last,1):'هنوز گرفته نشده'}</b> · نتیجه: ${esc(L.status||'—')}<br>در پوشه‌ی دوم، عکس‌های کالاها هم کپی می‌شوند (نسخه‌ی خودکار فقط دیتابیس است). برنامه باید باز باشد تا پشتیبان بگیرد.</p>
   <button class="btn p" onclick="backupSave()">ذخیره‌ی تنظیمات</button> <button class="btn" onclick="backup()">گرفتن پشتیبان همین الان</button></div>
  <div class="card tw" style="padding:0"><table><thead><tr><th>فایل</th><th>نوع</th><th>حجم</th><th>زمان</th><th></th></tr></thead><tbody>${L.files.map(f=>`<tr><td dir="ltr" style="text-align:right">${esc(f.name)}</td><td><span class="tag ${f.kind==='auto'?'g':f.kind==='before'?'a':'b'}">${kind[f.kind]}</span></td><td class="num">${sz(f.size)}</td><td class="num">${jd(f.time,1)}</td><td style="white-space:nowrap"><button class="btn s" onclick="backupRestore('${esc(f.name)}')">بازیابی</button> <button class="btn s d" onclick="backupDel('${esc(f.name)}')">حذف</button></td></tr>`).join('')||emptyRow(5,'هنوز پشتیبانی گرفته نشده')}</tbody></table></div>
  <div class="card"><h2>انتقال از برنامه‌ی قدیمی</h2><p class="sub">مسیر کامل فایل <code>distribution_pro.db</code> نسخه‌ی قبلی را بنویسید تا محصولات و مشتریان منتقل شوند.</p><div class="bar"><input id="old" dir="ltr" style="flex:1" placeholder="C:\\Users\\user\\Desktop\\robat\\distribution_pro.db"><button class="btn" onclick="impOld()">انتقال</button></div></div>`)
};
let UL=[];
async function loadUsers(){UL=await api('users_list');$('#ucard').innerHTML=`<table><thead><tr><th>نام کاربری</th><th>نقش</th><th>وضعیت</th><th></th></tr></thead><tbody>${UL.map(u=>`<tr><td><b>${esc(u.username)}</b></td><td>${u.role==='admin'?'مدیر':'کارمند'}</td><td>${u.active?'<span class="tag g">فعال</span>':'<span class="tag">غیرفعال</span>'}</td><td style="white-space:nowrap"><button class="btn s" onclick="userForm(${u.id})">ویرایش</button> <button class="btn s d" onclick="userDel(${u.id})">حذف</button></td></tr>`).join('')}</tbody></table>`}
function userForm(id){const u=UL.find(x=>x.id===id)||{role:'staff',active:1};
  modal(id?'ویرایش کاربر':'کاربر جدید',`<div class="frow">${fld('نام کاربری','u_n',u.username)}${fld(id?'رمز جدید (خالی = بدون تغییر)':'رمز عبور (حداقل ۶ کاراکتر)','u_p','','password','autocomplete="new-password"')}
  <div class="f"><label>نقش</label><select id="u_r"><option value="staff" ${u.role==='staff'?'selected':''}>کارمند</option><option value="admin" ${u.role==='admin'?'selected':''}>مدیر</option></select></div>
  <div class="f"><label>وضعیت</label><select id="u_a"><option value="1" ${u.active?'selected':''}>فعال</option><option value="0" ${u.active?'':'selected'}>غیرفعال</option></select></div></div>`,`<button class="btn p" onclick="userSave(${id||0})">ذخیره</button>`)}
async function userSave(id){await act('user_save',{u:{id:id||undefined,username:g('u_n'),password:g('u_p'),role:g('u_r'),active:+g('u_a')}},'ذخیره شد');closeModal();loadUsers()}
async function userDel(id){if(!confirm('این کاربر حذف شود؟'))return;await act('user_delete',{id},'حذف شد');loadUsers()}
async function setSave(){const s={};['shop_name','shop_phone','currency','shop_address','invoice_footer','template','auto_open','publish_delay','log_days','runs_days','jobs_days'].forEach(k=>s[k]=g('s_'+k));await act('settings_save',{s},'ذخیره شد');S.cfg=await api('settings_get');$('#brandName').textContent=S.cfg.shop_name}
async function backup(){const r=await act('backup');toast('پشتیبان گرفته شد'+(r.includes('\n')?' (پوشه‌ی دوم: '+r.split('\n')[1]+')':''),r.includes('\n'));PG.backup()}
async function backupSave(){await act('settings_save',{s:{backup_enabled:g('bk_en'),backup_interval_h:g('bk_int'),backup_keep:g('bk_keep'),backup_dir2:g('bk_dir')}},'ذخیره شد');PG.backup()}
async function backupRestore(name){if(!confirm('اطلاعات فعلی با این پشتیبان جایگزین می‌شود (از اطلاعات فعلی هم یک نسخه نگه داشته می‌شود). ادامه می‌دهید؟'))return;toast(await act('backup_restore',{name}));PG.backup()}
async function backupCancel(){await act('backup_cancel_restore');PG.backup()}
async function backupDel(name){if(!confirm('این فایل پشتیبان حذف شود؟'))return;await act('backup_delete',{name});PG.backup()}
async function impOld(){toast(await act('import_old',{path:g('old').trim().replace(/^"|"$/g,'')}))}

/* ───────── ورود ───────── */
function showLogin(setup){
  $('#login').classList.add('on');
  $('#login').innerHTML=`<div class="lbox"><h1>${setup?'ساخت حساب مدیر':'ورود به برنامه'}</h1><p class="sub" style="margin:0">${setup?'اولین بار است. یک نام کاربری و رمز برای مدیر بسازید.':'نام کاربری و رمز عبور را وارد کنید.'}</p>
  ${fld('نام کاربری','l_u','','text','autocomplete="username" autofocus')}${fld('رمز عبور'+(setup?' (حداقل ۶ کاراکتر)':''),'l_p','','password','autocomplete="current-password"')}
  ${setup?fld('تکرار رمز عبور','l_p2','','password','autocomplete="new-password"'):''}
  <div id="l_err" style="color:var(--red);min-height:22px;margin:8px 0"></div><button class="btn p" style="width:100%" id="l_b" onclick="doLogin(${setup})">${setup?'ساخت حساب و ورود':'ورود'}</button></div>`;
  $('#login').onkeydown=e=>{if(e.key==='Enter')doLogin(setup)};
  setTimeout(()=>$('#l_u')&&$('#l_u').focus(),50)
}
async function doLogin(setup){
  try{
    if(setup&&g('l_p')!==g('l_p2'))throw new Error('رمز و تکرار آن یکسان نیست');
    await api(setup?'setup':'login',{username:g('l_u'),password:g('l_p')});
    $('#login').classList.remove('on');$('#login').innerHTML='';boot()
  }catch(e){if(e.message!=='AUTH')$('#l_err').textContent=e.message}
}
function drawMe(){$('#me').innerHTML=`<b>👤 ${esc(S.me.user)} <span style="font-weight:400;color:#8a9aa8">(${S.me.role==='admin'?'مدیر':'کارمند'})</span></b><button onclick="pwForm()">رمز عبور</button><button onclick="logout()">خروج</button>`}
function pwForm(){modal('تغییر رمز عبور',`${fld('رمز فعلی','p_o','','password')}${fld('رمز جدید (حداقل ۶ کاراکتر)','p_n','','password')}${fld('تکرار رمز جدید','p_n2','','password')}`,`<button class="btn p" onclick="pwSave()">تغییر</button>`)}
async function pwSave(){if(g('p_n')!==g('p_n2'))return toast('رمز جدید و تکرار آن یکسان نیست',true);await act('password_change',{old:g('p_o'),new:g('p_n')},'رمز عبور تغییر کرد');closeModal()}
async function logout(){await api('logout');S.me=null;$('#view').innerHTML='';showLogin(false)}

/* ───────── شروع ───────── */
async function boot(){
  const me=await api('me').catch(()=>null);
  if(!me||!me.logged_in)return showLogin(me&&me.needs_setup);
  S.me=me;$('#login').classList.remove('on');buildNav();S.cfg=await api('settings_get');$('#brandName').textContent=S.cfg.shop_name;drawMe();go('dashboard');if(!S.timer)S.timer=setInterval(()=>{if(S.me)refreshBadges()},60000)
}
boot();
</script>
</body>
</html>
